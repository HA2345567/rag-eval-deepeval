[project]
name = "rag-eval-project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "My Name", email = "bhardwajharsh0312@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "chromadb>=1.5.9",
    "deepeval>=4.3.4",
    "langchain>=1.5.2",
    "langchain-chroma>=1.1.0",
    "langchain-core>=1.8.4",
    "langchain-nvidia-ai-endpoints>=1.5.0",
    "langchain-openai>=1.8.5",
    "langchain-text-splitters>=1.1.3",
    "openai>=3.57.0",
    "portalocker[win32]>=4.4.2 ; sys_platform == 'win32'",
    "pytest>=9.2.0",
    "python-dotenv>=1.2.4",
    "sentence-transformers>=6.3.0",
]

[project.scripts]
rag-eval-project = "rag_eval_project:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"
